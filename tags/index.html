  <!-- Flowing Gradient Blocks JS -->
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let colors = ['#f9d423', '#ff4e50', '#fc4a1a', '#6a11cb'];
    let blocks = [];

    class Block {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 200 + 50;
            this.speed = Math.random() * 2 + 1;
            this.color = colors[Math.floor(Math.random() * colors.length)];
        }

        update() {
            this.x += Math.cos(Math.random() * Math.PI) * this.speed;
            this.y += Math.sin(Math.random() * Math.PI) * this.speed;

            if (this.x > canvas.width || this.x < 0) this.speed = -this.speed;
            if (this.y > canvas.height || this.y < 0) this.speed = -this.speed;
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);
            ctx.fillStyle = this.color;
            ctx.globalAlpha = 0.7;
            ctx.fill();
        }
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (blocks.length < 50) {
            blocks.push(new Block());
        }

        blocks.forEach(block => {
            block.update();
            block.draw();
        });

        requestAnimationFrame(animate);
    }

    animate();
  </script>
