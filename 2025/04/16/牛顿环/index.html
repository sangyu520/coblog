  <script>
    function startTagCanvas() {
      const tagColors = ['#c9a0ff', '#a0d8ef', '#ffc0cb', '#b0e0e6', '#dda0dd', '#f0e68c', '#ffffff'];

      try {
        // 给每个标签添加不同颜色
const tagElements = document.querySelectorAll("#tags a");
const tagColors = ['#c9a0ff', '#a0d8ef', '#ffc0cb', '#b0e0e6', '#dda0dd', '#f0e68c', '#ffffff', '#ffb347', '#7fffd4'];

tagElements.forEach(tag => {
  const color = tagColors[Math.floor(Math.random() * tagColors.length)];
  tag.style.color = color;
});
        TagCanvas.Start("resCanvas", "tags", {
          textColour: null,
          outlineMethod: "none",
          reverse: true,
          depth: 0.8,
          maxSpeed: 0.08,
          textHeight: 16,
          weight: true,
          weightMode: 'size',
          fadeIn: 800,
          initial: [0.1, -0.1],
          minSpeed: 0.02
        });
      } catch(e) {
        console.log("TagCanvas error:", e);
        document.getElementById("myCanvasContainer").style.display = "none";
      }

      // 星星动画背景
      const bgCanvas = document.getElementById("bgCanvas");
      const ctx = bgCanvas.getContext("2d");
      const w = bgCanvas.width;
      const h = bgCanvas.height;
      const stars = [];

      for (let i = 0; i < 60; i++) {
        stars.push({
          x: Math.random() * w,
          y: Math.random() * h,
          r: Math.random() * 1.5 + 0.5,
          dx: (Math.random() - 0.5) * 0.2,
          dy: (Math.random() - 0.5) * 0.2,
          alpha: Math.random() * 0.5 + 0.5
        });
      }

      function drawStars() {
        ctx.clearRect(0, 0, w, h);
        for (let s of stars) {
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, 2 * Math.PI);
          ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
          ctx.fill();
          s.x += s.dx;
          s.y += s.dy;
          if (s.x < 0 || s.x > w) s.dx *= -1;
          if (s.y < 0 || s.y > h) s.dy *= -1;
        }
        requestAnimationFrame(drawStars);
      }

      drawStars();
    }

    // 初始化时加载
    document.addEventListener("DOMContentLoaded", startTagCanvas);
    // PJAX 页面切换后重新加载
    document.addEventListener("pjax:complete", startTagCanvas);

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const ripples = [];
    class Ripple {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.radius = 0;
            this.alpha = 0.6;
            this.maxRadius = 150;
            this.growthRate = 2;
            this.fadeRate = 0.02;
        }
        update() {
            this.radius += this.growthRate;
            this.alpha -= this.fadeRate;
            if (this.alpha <= 0) {
                this.alpha = 0;
                this.radius = this.maxRadius;
            }
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2, false);
            ctx.strokeStyle = `rgba(255, 255, 255, ${this.alpha})`;
            ctx.lineWidth = 2;
            ctx.stroke();
        }
    }

    function drawBackground() {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    canvas.addEventListener('click', (event) => {
        const ripple = new Ripple(event.clientX, event.clientY);
        ripples.push(ripple);
    });

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawBackground();
        ripples.forEach(ripple => {
            ripple.update();
            ripple.draw();
        });
        requestAnimationFrame(animate);
    }
    animate();

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>

    const size = Math.random() * 4 + 2; // 2px - 6px

    const delay = Math.random() * 5;

    snowflake.style.animationDuration = `${duration}s`;
    snowflake.style.animationDelay = `${delay}s`;

    snowflake.addEventListener('animationend', () => {
      const fallen = snowflake.cloneNode(true);
      fallen.style.top = 'auto';
      fallen.style.bottom = '0';
      fallen.style.left = `${left}vw`;
      fallen.style.position = 'absolute';
      fallen.style.animation = 'none';
      fallen.style.opacity = 0.5;

      accumulationContainer.appendChild(fallen);

      if (accumulationContainer.childElementCount > 100) {
        accumulationContainer.removeChild(accumulationContainer.firstChild);
      }

      snowflake.remove();

    snowflakeContainer.appendChild(snowflake);

    const duration = Math.random() * 8 + 6;
    const delay = Math.random() * 5;
    const color = ['#ffffff', '#d8f0ff'][Math.floor(Math.random() * 2)];
    const horizontalMove = (Math.random() - 0.5) * 100;

    snowflake.style.width = `${size}px`;
    snowflake.style.height = `${size}px`;
    snowflake.style.left = `${left}vw`;
    snowflake.style.backgroundColor = color;
    snowflake.style.setProperty('--x-move', `${horizontalMove}px`);
    snowflake.style.animationDuration = `${duration}s`;
    snowflake.style.animationDelay = `${delay}s`;

    snowflake.addEventListener('animationend', () => {
      const fallen = snowflake.cloneNode(true);
      fallen.style.top = 'auto';
      fallen.style.bottom = '0';
      fallen.style.left = `${left}vw`;
      fallen.style.position = 'absolute';
      fallen.style.animation = 'none';
      fallen.style.opacity = 0.5;
      fallen.style.transform = 'translateY(0) translateX(0)';
      fallen.style.filter = 'blur(1.2px)';
      fallen.style.boxShadow = '0 0 4px rgba(255,255,255,0.5)';
      accumulationContainer.appendChild(fallen);

      if (accumulationContainer.childElementCount > 100) {
        accumulationContainer.removeChild(accumulationContainer.firstChild);
      }

      snowflake.remove();
    });

    snowflakeContainer.appendChild(snowflake);
  }

  // 生成雪花
  setInterval(createSnowflake, 200);

  // 雪人计时器（60秒后显示）
  setTimeout(() => {
    snowman.style.display = 'block';

    const leftEye = document.createElement('div');
    leftEye.className = 'snowman-eye';
    snowman.appendChild(leftEye);

    const rightEye = document.createElement('div');
    rightEye.className = 'snowman-eye right';
    snowman.appendChild(rightEye);
  }, 60000);
</script>





<script>
function createSnowflake() {
  const snowflake = document.createElement('div');
  snowflake.classList.add('snowflake');
  const size = Math.random() * 6 + 4;
  const left = Math.random() * 100;
  const duration = Math.random() * 5 + 5;
  const swing = Math.random() * 100 - 50 + 'px';

  snowflake.style.width = `${size}px`;
  snowflake.style.height = `${size}px`;
  snowflake.style.left = `${left}%`;
  snowflake.style.animationDuration = `${duration}s`;
  snowflake.style.setProperty('--swing', swing);
  snowflake.style.backgroundColor = Math.random() > 0.5 ? 'rgba(255, 255, 255, 0.8)' : 'rgba(173, 216, 230, 0.7)';

  document.querySelector('.snowflakes').appendChild(snowflake);
  setTimeout(() => snowflake.remove(), duration * 1000);
}
setInterval(createSnowflake, 300);
</script>
<script>
window.addEventListener('load', () => {
  const loader = document.getElementById('shanshui-loader');
  loader.style.opacity = '0';
  setTimeout(() => loader.remove(), 2000);
});
</script>
