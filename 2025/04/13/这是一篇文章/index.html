  <style>
    body {
      margin: 0;
      overflow: hidden;
      position: relative;
    }

    /* Background Image Flow */
    .background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('https://cdn.jsdelivr.net/gh/sangyu520/picgo/img/background5.jpg'); /* Replace with your sky image */
      background-size: cover;
      animation: backgroundFlow 60s linear infinite;
    }

    /* Animation for background movement */
    @keyframes backgroundFlow {
      0% { background-position: 0 0; }
      100% { background-position: 100% 100%; }
    }

    /* Content flowing effect */
    .content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 2rem;
      text-align: center;
      z-index: 10;
    }

    /* Water Ripple Canvas Styling */
    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

  </style>
</head>

<body>
  <div class="background"></div>

  <!-- Content flowing in -->
  <div class="content">
    <h1>Welcome to the Flowing Image Experience</h1>
    <p>Enjoy the smooth animations as you scroll and interact with the page!</p>
  </div>

  <!-- Canvas for Water Ripple Effect -->
  <canvas id="canvas"></canvas>

  <script>
    // Water Ripple Effect (Canvas)
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const ripples = [];

    class Ripple {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.radius = 0;
            this.alpha = 0.6;
            this.maxRadius = 150;
            this.growthRate = 2;
            this.fadeRate = 0.02;
        }

        update() {
            this.radius += this.growthRate;
            this.alpha -= this.fadeRate;

            if (this.alpha <= 0) {
                this.alpha = 0;
                this.radius = this.maxRadius;
            }
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2, false);
            ctx.strokeStyle = `rgba(255, 255, 255, ${this.alpha})`;
            ctx.lineWidth = 2;
            ctx.stroke();
        }
    }

    function drawBackground() {
        // If you want to add a dynamic background effect, you can add more animations here
        ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    canvas.addEventListener('click', (event) => {
        const ripple = new Ripple(event.clientX, event.clientY);
        ripples.push(ripple);
    });

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawBackground();

        ripples.forEach(ripple => {
            ripple.update();
            ripple.draw();
        });

        requestAnimationFrame(animate);
    }

    animate();

    // Handle window resizing
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
</body>
