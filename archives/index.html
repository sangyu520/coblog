  <!-- Water Ripple Script -->
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const ripples = [];
    class Ripple {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.radius = 0;
            this.alpha = 0.6;
            this.maxRadius = 150;
            this.growthRate = 2;
            this.fadeRate = 0.02;
        }
        update() {
            this.radius += this.growthRate;
            this.alpha -= this.fadeRate;
            if (this.alpha <= 0) {
                this.alpha = 0;
                this.radius = this.maxRadius;
            }
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2, false);
            ctx.strokeStyle = `rgba(255, 255, 255, ${this.alpha})`;
            ctx.lineWidth = 2;
            ctx.stroke();
        }
    }

    function drawBackground() {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    canvas.addEventListener('click', (event) => {
        const ripple = new Ripple(event.clientX, event.clientY);
        ripples.push(ripple);
    });

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawBackground();
        ripples.forEach(ripple => {
            ripple.update();
            ripple.draw();
        });
        requestAnimationFrame(animate);
    }
    animate();

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>

  <script>
    const snowflakeContainer = document.querySelector('.snowflakes');

    function createSnowflake() {
      const snowflake = document.createElement('div');
      snowflake.classList.add('snowflake');

      const size = Math.random() * 4 + 2; // 2px to 6px
      const left = Math.random() * 100;
      const duration = Math.random() * 7 + 8; // 8s to 15s
      const delay = Math.random() * 5;

      snowflake.style.width = `${size}px`;
      snowflake.style.height = `${size}px`;
      snowflake.style.left = `${left}vw`;
      snowflake.style.animationDuration = `${duration}s`;
      snowflake.style.animationDelay = `${delay}s`;

      snowflakeContainer.appendChild(snowflake);

      setTimeout(() => {
        snowflake.remove();
      }, (duration + delay) * 1000);
    }

    setInterval(createSnowflake, 200);
    
  </script>
  <script>
  const snowflakeContainer = document.querySelector('.snowflakes');
  const accumulationContainer = document.querySelector('.snow-accumulation');

  function createSnowflake() {
    const snowflake = document.createElement('div');
    snowflake.classList.add('snowflake');

    const size = Math.random() * 4 + 2; // 2px - 6px
    const left = Math.random() * 100;
    const duration = Math.random() * 8 + 6; // 6s - 14s
    const delay = Math.random() * 5;
    const color = ['#ffffff', '#d8f0ff'][Math.floor(Math.random() * 2)];
    const horizontalMove = (Math.random() - 0.5) * 100;

    snowflake.style.width = `${size}px`;
    snowflake.style.height = `${size}px`;
    snowflake.style.left = `${left}vw`;
    snowflake.style.backgroundColor = color;
    snowflake.style.setProperty('--x-move', `${horizontalMove}px`);
    snowflake.style.animationDuration = `${duration}s`;
    snowflake.style.animationDelay = `${delay}s`;

    snowflake.addEventListener('animationend', () => {
      const fallen = snowflake.cloneNode(true);
